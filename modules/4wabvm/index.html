<div class="modulex-out">
  <div class="modulex">
    <div class="modulex-left">
      <img
        src="/img/{{id}}/{{img}}?v={{random}}"
        class="modulex-left-img"
        alt="{{title}}"
      />
    </div>
    <div class="modulex-right">
      <div class="modulex-right-body">
        <div class="modulex-right-body-name">{{name}}</div>
        <div class="modulex-right-body-spot">{{description}}</div>
        <div class="modulex-right-body-chile">
          <div class="modulex-right-body-chile-row">
            <div class="modulex-right-body-chile-row-name">{{name2}}</div>
            <div class="modulex-right-body-chile-row-spot">{{spot2}}</div>
          </div>
          <div class="modulex-right-body-chile-row">
            <div class="modulex-right-body-chile-row-name">{{name3}}</div>
            <div class="modulex-right-body-chile-row-spot">{{spot3}}</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<style>
  .modulex-out {
    background-color: --bgcolor--;
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: --fontcolor--;
    margin: --margintop--px 0px --marginbotton--px 0px;
    float: left;
    overflow-x: clip;
  }

  .modulex-right-body-chile {
    display: flex;
    flex-direction: row;
    gap: 20px;
  }

  .modulex-right-body-chile-row {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }

  .modulex-right-body-chile-row-name {
    font-size: 22px;
    font-weight: 500;
  }

  .modulex-right-body-chile-row-spot {
    font-size: 14px;
  }

  .modulex-right-body {
    width: 100%;
    margin-left: 200px;
    display: flex;
    flex-direction: column;
    gap: 15px;
    padding: 10px;
  }

  .modulex-right-body-name {
    font-size: 28px;
    font-weight: 500;
  }

  .modulex-right-body-spot {
    font-size: 18px;
  }

  .modulex {
    width: var(--max);
    display: flex;
    flex-direction: row;
    float: left;
    opacity: 0;
    animation: fadeIn 0.6s ease-out forwards;
  }

  @keyframes fadeIn {
    0% {
      opacity: 0;
    }
    100% {
      opacity: 1;
    }
  }

  .modulex-right {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .modulex-left {
    background-color: #fff;
    display: flex;
    align-items: center;
    justify-content: right;
    position: relative;
    overflow: visible;
  }

  .modulex-left-img {
    aspect-ratio: 1/1;
    border-radius: 100%;
    width: 300px;
    background-color: bisque;
    margin-right: -150px;
    border: solid 15px #fff;
    position: relative;
    z-index: 2;
    animation: fadeInScale 0.5s ease-out;
    /* AN5: sonsuz "rotatingGlow" kaldırıldı — ışıltı durağan (eski döngünün 0% karesi) */
    box-shadow: 0 4px 40px rgba(29, 27, 76, 0.32),
                0 0 30px --fontcolor--,
                0 0 60px --fontcolor--,
                0 0 90px --fontcolor--;
  }

  /* Dönen ışık efekti için pseudo-element */
  .modulex-left-img::before {
    content: '';
    position: absolute;
    top: -20px;
    left: -20px;
    right: -20px;
    bottom: -20px;
    border-radius: 50%;
    background: conic-gradient(
      from 0deg,
      transparent 0deg,
      transparent 60deg,
      --fontcolor-- 90deg,
      --fontcolor-- 120deg,
      transparent 150deg,
      transparent 210deg,
      --fontcolor-- 240deg,
      --fontcolor-- 270deg,
      transparent 300deg,
      transparent 360deg
    );
    opacity: 0.6;
    z-index: -1;
    filter: blur(20px);
  }

  .modulex-left-img::after {
    content: '';
    position: absolute;
    top: -30px;
    left: -30px;
    right: -30px;
    bottom: -30px;
    border-radius: 50%;
    background: conic-gradient(
      from 180deg,
      transparent 0deg,
      transparent 60deg,
      --fontcolor-- 90deg,
      --fontcolor-- 120deg,
      transparent 150deg,
      transparent 210deg,
      --fontcolor-- 240deg,
      --fontcolor-- 270deg,
      transparent 300deg,
      transparent 360deg
    );
    opacity: 0.4;
    z-index: -2;
    filter: blur(30px);
  }

  /* AN5: sonsuz "rotateGlow" (::before/::after) ve "rotatingGlow" döngüleri kaldırıldı.
     Not: <img> öğesi ::before/::after çizmez; dönen ışık zaten görünmüyordu. */

  /* Fade in ve scale animasyonu */
  @keyframes fadeInScale {
    0% {
      opacity: 0;
      transform: scale(0.8);
    }
    100% {
      opacity: 1;
      transform: scale(1);
    }
  }

  /* İçerik animasyonları - Daha dinamik */
  .modulex-right-body {
    animation: slideInRightBounce 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.15s both;
  }

  @keyframes slideInRightBounce {
    0% {
      opacity: 0;
      transform: translateX(100px) scale(0.8);
    }
    60% {
      transform: translateX(-10px) scale(1.05);
    }
    80% {
      transform: translateX(5px) scale(0.98);
    }
    100% {
      opacity: 1;
      transform: translateX(0) scale(1);
    }
  }

  .modulex-right-body-name {
    animation: slideInLeftBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.3s both;
  }

  @keyframes slideInLeftBounce {
    0% {
      opacity: 0;
      transform: translateX(-80px) translateY(20px) rotate(-5deg);
    }
    60% {
      transform: translateX(10px) translateY(-5px) rotate(2deg);
    }
    80% {
      transform: translateX(-5px) translateY(2px) rotate(-1deg);
    }
    100% {
      opacity: 1;
      transform: translateX(0) translateY(0) rotate(0deg);
    }
  }

  .modulex-right-body-spot {
    animation: slideInRightBounceText 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.4s both;
  }

  @keyframes slideInRightBounceText {
    0% {
      opacity: 0;
      transform: translateX(60px) translateY(30px) scale(0.9);
    }
    60% {
      transform: translateX(-8px) translateY(-5px) scale(1.02);
    }
    80% {
      transform: translateX(4px) translateY(2px) scale(0.99);
    }
    100% {
      opacity: 1;
      transform: translateX(0) translateY(0) scale(1);
    }
  }

  .modulex-right-body-chile-row:first-child {
    animation: slideInUpBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.5s both;
  }

  .modulex-right-body-chile-row:last-child {
    animation: slideInUpBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) 0.6s both;
  }

  @keyframes slideInUpBounce {
    0% {
      opacity: 0;
      transform: translateY(50px) translateX(-30px) scale(0.8) rotate(3deg);
    }
    60% {
      transform: translateY(-10px) translateX(5px) scale(1.05) rotate(-1deg);
    }
    80% {
      transform: translateY(3px) translateX(-2px) scale(0.98) rotate(0.5deg);
    }
    100% {
      opacity: 1;
      transform: translateY(0) translateX(0) scale(1) rotate(0deg);
    }
  }

  @media screen and (max-width: 1024px) {
    .modulex {
      width: 100%;
      display: flex;
      flex-direction: column;
      min-height: 400px;
      float: left;
      padding: 15px 0px 15px 0px;
    }

    .modulex-left-img {
      width: calc(var(--max) / 2);
      max-width: 200px;
      margin-right: 0px;
      float: left;
    }

    .modulex-left-img::before,
    .modulex-left-img::after {
      top: -15px;
      left: -15px;
      right: -15px;
      bottom: -15px;
      filter: blur(15px);
    }

    .modulex-right-body {
      margin-left: 0;
      padding: 10px;
    }

    .modulex-left {
      justify-content: center;
      background-color: --bgcolor--;
    }
  }

  @media screen and (min-width: 1024px) {
    .modulex {
      width: var(--max);
      display: flex;
      flex-direction: row;
    }

    .modulex-right-body-chile-row {
      flex: 1;
    }

    .modulex-right {
      flex: 5;
    }

    .modulex-left {
      flex: 1;
    }
  }

  /* RTL masaustu: halka sag kenardan tasmasin, duzen aynalanir (LTR'de etkisiz) */
  @media screen and (min-width: 1025px) {
    [dir="rtl"] .modulex-left {
      justify-content: left;
    }

    [dir="rtl"] .modulex-left-img {
      margin-right: 0;
      margin-left: -150px;
    }

    [dir="rtl"] .modulex-right-body {
      margin-left: 0;
      margin-right: 200px;
    }
  }

  /* desing.haleKapali doluysa halka isiltisiz, yumusak golge; bos birakilan sitede gorunum degismez */
  .modulex-halesiz .modulex-left-img {
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.14);
  }

  /* W2: mobil tasma kontrolu */
  @media (max-width: 768px) {
    [class*="modulex"] {
      max-width: 100%;
      box-sizing: border-box;
    }
  }

  /* W2: erisilebilirlik — animasyon kapatma */
  @media (prefers-reduced-motion: reduce) {
    [class*="modulex"],
    [class*="modulex"] * {
      animation: none !important;
      transition: none !important;
    }

    /* giris animasyonu kapaliyken icerik opacity:0'da kalmasin */
    .modulex {
      opacity: 1;
    }
  }
</style>
